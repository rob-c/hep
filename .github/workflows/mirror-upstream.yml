name: Mirror upstream

# Upstream go-hep lives on Codeberg, so GitHub's "Sync fork" button is of no
# use here: it can only ever pull from the archived go-hep/hep GitHub parent.
# This job keeps the "upstream" branch of this fork an exact copy of Codeberg's
# main, which is what makes "git diff upstream main" mean exactly this fork.
#
# It runs from the default branch (main), not from the branch it writes, so
# refreshing the mirror cannot delete the job that does the refreshing. Pushing
# with GITHUB_TOKEN deliberately does not trigger CI on the mirror: those
# commits are upstream's and have already been tested upstream.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-upstream
  cancel-in-progress: false

jobs:

  mirror:
    name: Mirror codeberg/main to upstream
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch upstream
      run: git fetch --no-tags https://codeberg.org/go-hep/hep.git main

    - name: Report
      run: |
        echo "codeberg main:  $(git rev-parse FETCH_HEAD)"
        echo "fork  upstream:  $(git rev-parse --verify -q origin/upstream || echo '<none>')"

    - name: Push to upstream
      run: git push --force origin FETCH_HEAD:refs/heads/upstream
